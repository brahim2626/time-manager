# ================================================
# NGINX.PROD.CONF — Configuration production
# ================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Sécurité : cacher la version de Nginx ──
    server_tokens off;

    # ── Compression gzip ────────────────────────
    # Réduit la taille des réponses → plus rapide
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json
                    application/javascript text/xml
                    application/xml image/svg+xml;

    # ── Rate limiting ───────────────────────────
    # Limite les tentatives de connexion (anti brute-force)
    # 10MB pour stocker les IPs, 10 requêtes/minute
    limit_req_zone $binary_remote_addr
        zone=login_limit:10m rate=10r/m;

    # ── Upstream ────────────────────────────────
    upstream backend {
        server backend:4000;
    }

    # ── Serveur HTTP → redirige vers HTTPS ──────
    server {
        listen 80;
        server_name localhost;

        # En production réelle, tu redirigerais vers HTTPS :
        # return 301 https://$host$request_uri;

        # Pour nos tests, on garde HTTP :
        include /etc/nginx/conf.d/locations.conf;
    }
}