# ================================================
# NGINX.DEV.CONF — Configuration développement
# ================================================

events {
    worker_connections 1024;
}

http {

    # ── Types MIME ──────────────────────────────
    # Permet à Nginx de comprendre les types de fichiers
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logs ────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Upstream : nos services ─────────────────
    # "upstream" = définit des groupes de serveurs
    upstream backend {
        server backend:4000;    # "backend" = nom du service Docker
    }

    upstream frontend {
        server frontend:3000;   # "frontend" = nom du service Docker
    }

    # ── Serveur principal ────────────────────────
    server {
        listen 80;              # Écoute sur le port 80 (HTTP)
        server_name localhost;

        # ── Timeout ────────────────────────────
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # ── Route API → Backend ─────────────────
        # Tout ce qui commence par /api/ va au backend
        location /api/ {
            proxy_pass http://backend;

            # Headers importants pour le backend
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Route Health ────────────────────────
        location /health {
            proxy_pass http://backend;
        }

        # ── Tout le reste → Frontend ────────────
        location / {
            proxy_pass http://frontend;

            # Nécessaire pour le hot-reload de Vite (WebSocket)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
        }
    }
}